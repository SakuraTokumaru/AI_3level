<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さんレベル相談室｜3つのAIに相談</title>
<meta name="description" content="AI-A・AI-B・AI-Cの3つのAIに、それぞれ別々の会話で相談できるアプリです。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2317b6a3'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif'%3E3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-level="1">

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">3</span>
      <div class="brand__text">
        <h1 class="brand__title">さんレベル相談室</h1>
        <p class="brand__sub">3つのAIから選んで相談できます</p>
      </div>
    </div>
    <div class="topbar__actions">
      <button class="btn btn--ghost" id="btn-open-data" type="button">会話データ</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="levels" aria-labelledby="levelsTitle">
    <h2 class="sr-only" id="levelsTitle">AIを選ぶ</h2>
    <div class="level-list" id="levelList" role="tablist" aria-label="AIの選択"></div>
  </section>

  <section class="chat" aria-labelledby="chatName">
    <header class="chat__head">
      <div class="chat__persona">
        <span class="avatar avatar--lg" id="chatAvatar" aria-hidden="true">A</span>
        <div class="chat__who">
          <p class="chat__name" id="chatName">AI-A</p>
        </div>
      </div>
      <div class="chat__tools">
        <button class="btn btn--sm" id="btn-handoff" type="button">他のAIにも聞く</button>
      </div>
    </header>


    <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="composer">
      <div class="chips" id="chips" aria-label="入力例"></div>
      <form class="composer__form" id="composerForm" autocomplete="off">
        <label class="sr-only" for="input">相談内容</label>
        <textarea id="input" rows="1" placeholder="相談したいことを書いてみましょう…" maxlength="1200"></textarea>
        <button class="composer__send" id="btnSend" type="submit" aria-label="送信する">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8z"/></svg>
        </button>
      </form>
      <p class="composer__note">Enterで送信／Shift+Enterで改行。会話はAIごとに別々に保存されます。</p>
    </div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" aria-labelledby="drawerTitle" aria-hidden="true">
  <header class="drawer__head">
    <div>
      <h2 id="drawerTitle">会話データ</h2>
      <p class="drawer__sub">会話の保存・読み込み・削除ができます</p>
    </div>
    <button class="icon-btn" id="btnCloseDrawer" type="button" aria-label="閉じる">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>

  <div class="drawer__body">
    <section class="data-block data-block--first" aria-labelledby="dataTitle">
      <h3 id="dataTitle">会話データ</h3>
      <p class="data-block__meta" id="dataMeta">—</p>
      <div class="btn-row">
        <button class="btn btn--sm" id="btnExport" type="button">エクスポート</button>
        <label class="btn btn--sm" for="importFile">インポート<input id="importFile" type="file" accept="application/json,.json" hidden></label>
        <button class="btn btn--sm btn--danger" id="btnClearLevel" type="button">このAIの会話を削除</button>
      </div>
      <p class="hint">会話履歴はこの端末のブラウザ内（localStorage）に保存されます。返答を作るため、送信した内容と直近の会話はサーバー経由でAI（Claude API）に送られます。</p>
    </section>
  </div>
</aside>

<div class="modal" id="handoffModal" hidden>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="handoffTitle">
    <h2 id="handoffTitle">他のAIにも同じ相談をする</h2>
    <p class="modal__lead">直近のあなたのメッセージを、選んだAIの会話に引き継ぎます。</p>
    <p class="modal__quote" id="handoffPreview"></p>
    <div class="handoff-list" id="handoffList"></div>
    <button class="btn btn--ghost modal__close" id="btnCloseHandoff" type="button">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/personas.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
